<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiART. — Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
header{padding:28px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #0f0f0f}
header h1{font-size:20px;letter-spacing:5px;font-weight:700}
header h1 span{color:#ff1a1a}
.hero{text-align:center;padding:100px 20px 80px}
.hero img{width:160px;max-width:60vw;margin-bottom:24px}
.hero h2{font-size:11px;letter-spacing:7px;color:#444;font-weight:400}
.hero p{margin-top:24px;color:#666;font-size:13px;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.6}
.status{max-width:700px;margin:0 auto;padding:40px 20px}
.empty{border:1px dashed #1a1a1a;border-radius:20px;padding:40px;text-align:center}
.empty h3{font-size:12px;letter-spacing:4px;color:#888;margin-bottom:12px}
.empty p{color:#333;font-size:12px;line-height:1.6}
.projects{max-width:900px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
/* CUANDO QUIERAS AÑADIR UN PROYECTO, SOLO COPIA ESTO:
<div class="card">
<h3>MiAcorde</h3>
<p>Descripción corta</p>
<a href="/proyecto.html?id=miacorde">ABRIR →</a>
</div>
*/
.card{background:#0a0a0a;border:1px solid #151515;border-radius:18px;padding:28px}
.card h3{font-size:14px;letter-spacing:2px;margin-bottom:8px}
.card p{color:#555;font-size:12px;margin-bottom:20px;line-height:1.5}
.card a{font-size:10px;letter-spacing:2px;color:#fff;text-decoration:none;border:1px solid #222;padding:10px 18px;border-radius:999px;display:inline-block}
footer{text-align:center;padding:80px 20px;color:#222;font-size:10px;letter-spacing:4px}
</style>
</head>
<body>
<header>
<h1>MiART<span>.</span></h1>
</header>

<div class="hero">
<img src="Logo.jpeg" alt="MiART">
<h2>OFFICIAL</h2>
<p>Estoy construyendo mis herramientas. Aquí publicaré mis proyectos cuando estén listos para descargar.</p>
</div>

<div class="status">
<div class="empty">
<h3>NO HAY PROYECTOS AÚN</h3>
<p>Actualmente trabajando en: MiAcorde, MiStudio y más.<br>Cuando un proyecto esté terminado aparecerá aquí automáticamente.</p>
</div>
</div>

<div class="projects" id="projects">
<!-- Vacío a propósito. Aquí aparecerán tus proyectos -->
</div>

<footer>© 2026 MiART.</footer>
</body>
</html>
